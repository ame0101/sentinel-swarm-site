<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Custom favicon -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FF3A00" />
    <meta
      name="description"
      content="Sentinel Swarm - Enterprise Security Platform combining Geo-Swarm Defensive Orchestration (GSDO) with Metamorphic Proxy at the Edge (MPE)"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    
    <!-- Preload fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Open Graph / Social Media Meta Tags -->
    <meta property="og:title" content="Sentinel Swarm - Enterprise Security Platform" />
    <meta property="og:description" content="A next-generation cybersecurity platform featuring real-time threat detection and adaptive defenses." />
    <meta property="og:image" content="https://sentinel-swarm.net/og-image.png" />
    <meta property="og:url" content="https://sentinel-swarm.net" />
    <meta name="twitter:card" content="summary_large_image" />
    
    <title>Sentinel Swarm - Enterprise Security Platform</title>
    
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-color: #121212;
        color: #FFFFFF;
      }
      
      /* Loading spinner for initial page load */
      .initial-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background-color: #0a0a0a;
        z-index: 9999;
      }
      
      .loader-logo {
        width: 80px;
        height: 80px;
        margin-bottom: 20px;
        border-radius: 12px;
        background: linear-gradient(135deg, #FF3A00 0%, #FF5C00 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 10px 25px rgba(255, 58, 0, 0.5);
        animation: pulse 2s infinite;
      }
      
      .loader-text {
        color: #AAAAAA;
        font-size: 16px;
        margin-top: 16px;
      }
      
      @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.05); }
        100% { transform: scale(1); }
      }
      
      /* Demo banner styling */
      .demo-banner {
        background-color: rgba(255, 171, 0, 0.15);
        color: #FFAB00;
        text-align: center;
        padding: 10px;
        font-weight: 600;
        border-bottom: 1px solid #FFAB00;
      }
    </style>
  </head>
  <body>
    <noscript>
      <div class="demo-banner">
        You need to enable JavaScript to run this application.
      </div>
    </noscript>
    
    <!-- Initial loading state that will be replaced by React -->
    <div class="initial-loader" id="initial-loader">
      <div class="loader-logo">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
        </svg>
      </div>
      <div class="loader-text">Loading Sentinel Swarm...</div>
    </div>
    
    <div id="root"></div>
    
    <script>
      // Remove the loader once the app is loaded
      window.addEventListener('load', function() {
        setTimeout(function() {
          var loader = document.getElementById('initial-loader');
          if (loader) {
            loader.style.opacity = '0';
            loader.style.transition = 'opacity 0.5s ease';
            setTimeout(function() {
              if (loader.parentNode) {
                loader.parentNode.removeChild(loader);
              }
            }, 500);
          }
        }, 300);
      });
    </script>
  </body>
</html>
